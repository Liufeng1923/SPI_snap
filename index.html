<!-- trigger pages deploy -->
<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SPI 练习拍照对答案</title>

  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0c;
      color: #f5f5f7;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      max-width: 760px;
      margin: auto;
      padding: 16px;
    }

    h1 {
      font-size: 21px;
      margin: 2px 0 14px;
    }

    .card {
      background: #19191b;
      border: 1px solid #2b2b2e;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin: 0 0 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #444;
      border-radius: 10px;
      background: #0f0f10;
      color: white;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .camera {
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      aspect-ratio: 3/4;
    }

    video,
    #preview {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #preview {
      display: none;
    }

    button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 11px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #f5f5f7;
      color: #111;
    }

    .secondary {
      background: #303034;
      color: #fff;
    }

    button:disabled {
      opacity: .5;
    }

    .status {
      font-size: 13px;
      color: #aaa;
      margin-top: 10px;
      min-height: 20px;
    }

    .answer {
      font-size: 38px;
      font-weight: 800;
      margin: 4px 0 12px;
    }

    .explanation {
      white-space: pre-wrap;
      line-height: 1.55;
      color: #ddd;
    }

    .small {
      font-size: 12px;
      line-height: 1.5;
      color: #888;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>

  <main>

    <h1>SPI 练习题 · 拍照对答案</h1>

    <!-- API 设置 -->
    <section class="card">

      <label>
        OpenAI API Key（保存在本机浏览器）
      </label>

      <input
        id="key"
        type="password"
        autocomplete="off"
        placeholder="sk-..."
      >

      <label>
        模型
      </label>

      <input
        id="model"
        value="gpt-5.6-sol"
        autocomplete="off"
      >

      <div class="small">
        API Key 保存在当前浏览器的 localStorage 中。
        请仅在自己的设备上使用。
      </div>

    </section>


    <!-- 相机 -->
    <section class="card">

      <div class="camera">

        <video
          id="video"
          autoplay
          playsinline
          muted>
        </video>

        <img
          id="preview"
          alt="已拍摄题目"
        >

      </div>


      <div style="margin-top:10px">

        <button
          id="shoot"
          class="primary">
          拍照
        </button>

        <button
          id="retry"
          class="secondary"
          style="display:none">
          重新拍照
        </button>

      </div>


      <div
        id="status"
        class="status">
        正在启动摄像头…
      </div>

    </section>


    <!-- 答案 -->
    <section class="card">

      <label>
        答案
      </label>

      <div
        id="answer"
        class="answer">
        —
      </div>


      <label>
        简要解析
      </label>

      <div
        id="explanation"
        class="explanation">
        拍照后自动显示结果。
      </div>

    </section>


    <canvas id="canvas"></canvas>

  </main>


  <script>

    /* =========================
       DOM
    ========================= */

    const $ = s => document.querySelector(s);

    const video = $('#video');
    const canvas = $('#canvas');
    const preview = $('#preview');

    const statusEl = $('#status');
    const answerEl = $('#answer');
    const explanationEl = $('#explanation');

    const keyInput = $('#key');
    const modelInput = $('#model');

    let stream = null;



    /* =========================
       LocalStorage
    ========================= */

    const savedKey =
      localStorage.getItem('openai_api_key');

    if (savedKey) {
      keyInput.value = savedKey;
    }


    const savedModel =
      localStorage.getItem('openai_model');

    if (savedModel) {
      modelInput.value = savedModel;
    }


    /*
      API Key 输入完成后保存
    */

    keyInput.addEventListener('change', () => {

      const key =
        keyInput.value.trim();

      if (key) {

        localStorage.setItem(
          'openai_api_key',
          key
        );

      } else {

        localStorage.removeItem(
          'openai_api_key'
        );

      }

    });


    /*
      模型名称保存
    */

    modelInput.addEventListener('change', () => {

      const model =
        modelInput.value.trim();

      if (model) {

        localStorage.setItem(
          'openai_model',
          model
        );

      } else {

        localStorage.removeItem(
          'openai_model'
        );

      }

    });



    /* =========================
       Camera
    ========================= */

    async function startCamera() {

      try {

        /*
          停止之前的摄像头
        */

        if (stream) {

          stream
            .getTracks()
            .forEach(
              track => track.stop()
            );

        }


        /*
          打开后置摄像头
        */

        stream =
          await navigator.mediaDevices
            .getUserMedia({

              video: {

                facingMode: {
                  ideal: 'environment'
                },

                width: {
                  ideal: 1920
                },

                height: {
                  ideal: 1080
                }

              },

              audio: false

            });


        video.srcObject = stream;


        /*
          显示实时画面
        */

        video.style.display =
          'block';

        preview.style.display =
          'none';


        /*
          按钮
        */

        $('#shoot').style.display =
          'flex';

        $('#retry').style.display =
          'none';


        statusEl.textContent =
          '摄像头已就绪';


      } catch (e) {

        statusEl.textContent =
          '摄像头无法启动：' +
          e.message;

      }

    }



    /* =========================
       拍照
    ========================= */

    function capture() {

      const max = 1800;

      const scale =
        Math.min(
          1,
          max / video.videoWidth
        );


      canvas.width =
        Math.round(
          video.videoWidth * scale
        );


      canvas.height =
        Math.round(
          video.videoHeight * scale
        );


      const ctx =
        canvas.getContext('2d');


      ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );


      /*
        JPEG

        0.88 =
        图片质量 88%
      */

      return canvas.toDataURL(
        'image/jpeg',
        0.88
      );

    }



    /* =========================
       获取模型文本
    ========================= */

    function outputText(data) {

      if (data.output_text) {
        return data.output_text;
      }


      const parts = [];


      for (
        const item
        of (data.output || [])
      ) {

        for (
          const content
          of (item.content || [])
        ) {

          if (
            content.type ===
            'output_text'
            &&
            content.text
          ) {

            parts.push(
              content.text
            );

          }

        }

      }


      return parts.join('\n');

    }



    /* =========================
       OpenAI
    ========================= */

    async function solve(image) {

      const key =
        keyInput.value.trim();


      const model =
        modelInput.value.trim();


      if (!key) {

        throw new Error(
          '请先输入 OpenAI API Key'
        );

      }


      if (!model) {

        throw new Error(
          '请输入模型名称'
        );

      }


      /*
        再保存一次。

        即使用户输入 API Key
        后直接点拍照，没有触发 change，
        这里也会保存。
      */

      localStorage.setItem(
        'openai_api_key',
        key
      );


      localStorage.setItem(
        'openai_model',
        model
      );


      statusEl.textContent =
        '正在解析…';


      answerEl.textContent =
        '…';


      explanationEl.textContent =
        '';


      const prompt = `
这是日本就职 SPI 的练习/模拟题，用于做完后核对答案。

仔细读取图片中的：
- 日文题干
- 数字
- 表格
- 图形
- 所有选项

然后独立计算。

如果图片不清楚、题目被截断、选项不完整，
不要猜答案，请要求重新拍照。

只按照以下格式回答：

答案：<选项编号/字母或最终答案>
解析：<中文简要核对过程，最多180字>
      `.trim();



      const res =
        await fetch(
          'https://api.openai.com/v1/responses',
          {

            method: 'POST',

            headers: {

              'Content-Type':
                'application/json',

              'Authorization':
                'Bearer ' + key

            },

            body: JSON.stringify({

              model: model,

              input: [

                {

                  role: 'user',

                  content: [

                    {

                      type:
                        'input_text',

                      text:
                        prompt

                    },

                    {

                      type:
                        'input_image',

                      image_url:
                        image,

                      detail:
                        'high'

                    }

                  ]

                }

              ]

            })

          }
        );


      const data =
        await res.json();


      if (!res.ok) {

        throw new Error(

          data?.error?.message
          ||
          (
            'HTTP ' +
            res.status
          )

        );

      }


      const text =
        outputText(data)
          .trim();



      /* =========================
         提取答案
      ========================= */


      const answerMatch =
        text.match(
          /答案[：:]\s*(.*?)(?:\n|$)/
        );


      const explanationMatch =
        text.match(
          /解析[：:]\s*([\s\S]*)/
        );



      answerEl.textContent =

        answerMatch?.[1]?.trim()

        ||

        '见解析';



      explanationEl.textContent =

        explanationMatch?.[1]?.trim()

        ||

        text

        ||

        '没有返回文本';



      statusEl.textContent =
        '解析完成';

    }



    /* =========================
       拍照按钮
    ========================= */

    $('#shoot').onclick =
      async () => {

        try {

          if (
            !video.videoWidth
          ) {

            throw new Error(
              '摄像头尚未就绪'
            );

          }


          /*
            拍照
          */

          const image =
            capture();



          /*
            在原来的相机区域
            显示拍摄结果
          */

          preview.src =
            image;


          preview.style.display =
            'block';


          video.style.display =
            'none';



          /*
            关闭摄像头
          */

          if (stream) {

            stream
              .getTracks()
              .forEach(
                track =>
                  track.stop()
              );

          }



          /*
            切换按钮
          */

          $('#shoot')
            .style
            .display =
            'none';


          $('#retry')
            .style
            .display =
            'flex';



          /*
            自动解析
          */

          await solve(
            image
          );


        } catch (e) {


          statusEl.textContent =
            '失败';


          answerEl.textContent =
            '错误';


          explanationEl.textContent =
            e.message;


        }

      };



    /* =========================
       重新拍照
    ========================= */

    $('#retry').onclick =
      async () => {


        answerEl.textContent =
          '—';


        explanationEl.textContent =
          '拍照后自动显示结果。';


        statusEl.textContent =
          '正在重新启动摄像头…';


        await startCamera();

      };



    /* =========================
       启动
    ========================= */

    startCamera();

  </script>

</body>

</html>
